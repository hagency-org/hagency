[package]
name = "hagency-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hagency-platform = { path = "../hagency-platform" }
sha2.workspace = true
hmac = "=0.12.1"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
hagency-core = { path = "../hagency-core" }
hagency-metering = { path = "../hagency-metering" }
time = { version = "=0.3.55", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
getrandom = "0.3.4"
rusqlite = { version = "=0.37.0", default-features = false, features = ["bundled", "trace"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.3", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
